<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Runs before first paint: drop no-js, and on /resume switch straight into
       the reading view so recruiters get the page without waiting on the 3D
       bundle. The path test normalises exactly like parsePath() in
       src/routes.js (lowercase, strip every trailing slash) against RESUME_PATH. -->
  <script>
    (function (d) {
      d.classList.remove('no-js');
      if (location.pathname.toLowerCase().replace(/\/+$/, '') === '/resume') d.classList.add('resume-open');
    })(document.documentElement);
  </script>
  <title>Brendan Hoss — Solutions Engineer</title>
  <meta name="description" content="Brendan Hoss — Solutions Engineer. Walk through a little shoreline town and explore the work: no-code platform solutions, n8n automation, and AI-driven tooling." />
  <meta property="og:title" content="Brendan Hoss — Solutions Engineer" />
  <meta property="og:description" content="A walkable little shoreline town — explore the work, one landmark at a time." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://brendanhoss.com" />
  <meta property="og:image" content="https://brendanhoss.com/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Brendan Hoss — Solutions Engineer" />
  <meta name="twitter:image" content="https://brendanhoss.com/og.jpg" />
  <meta name="theme-color" content="#8fd0d6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%238fd0d6'/><path d='M9 22V10h3v4.5h3.5V10h3v12h-3v-5H12v5z' fill='%23f9f3e6'/></svg>" />
  <link rel="canonical" href="https://brendanhoss.com" />
  <link rel="preload" href="/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WBHYXKGD0V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // Our own reload (diorama fallback / context restore, src/diorama/flag.js RELOAD_KEY) replays a
    // page the visitor already viewed: configure GA without a second page_view.
    (function () {
      var replay = false;
      try { replay = !!sessionStorage.getItem('bh_fallback_reload'); } catch (e) { /* private mode */ }
      if (replay) gtag('config', 'G-WBHYXKGD0V', { send_page_view: false });
      else gtag('config', 'G-WBHYXKGD0V');
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Brendan Hoss",
    "jobTitle": "Solutions Engineer",
    "worksFor": { "@type": "Organization", "name": "Veoci" },
    "address": { "@type": "PostalAddress", "addressLocality": "Branford", "addressRegion": "CT", "addressCountry": "US" },
    "url": "https://brendanhoss.com",
    "email": "mailto:hossbrendan@gmail.com",
    "sameAs": ["https://linkedin.com/in/brendan-hoss", "https://github.com/Bh0ss"],
    "knowsAbout": ["No-code platforms", "n8n automation", "Solution Architecture", "AI tooling", "REST APIs", "Python"]
  }
  </script>
  <!-- Critical, inline loader styles. These must live in the document head (not
       in the JS-bundled style.css) so the preloader paints on first parse —
       before the module bundle (and, off /resume, the 3D chunk) downloads and executes. Fredoka is
       preloaded above, so declaring the @font-face here renders the wordmark
       in-brand immediately. -->
  <style>
    @font-face {
      font-family: 'Fredoka';
      font-style: normal;
      font-weight: 600 700;
      font-display: swap;
      src: url('/fonts/fredoka.woff2') format('woff2');
    }
    html, body { margin: 0; height: 100%; background: #8fd0d6; }
    #preloader {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 26px;
      background: #8fd0d6;
      transition: opacity 0.55s ease;
    }
    #preloader.hidden { opacity: 0; pointer-events: none; }
    #preloader .pl-mark {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 700; font-size: 46px; letter-spacing: 1px;
      color: #f9f3e6; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
    }
    #preloader .pl-dots { display: flex; gap: 10px; }
    #preloader .pl-dots span {
      width: 11px; height: 11px; border-radius: 50%;
      background: #f9f3e6; opacity: 0.4;
      animation: pl-pulse 1.1s ease-in-out infinite;
    }
    #preloader .pl-dots span:nth-child(2) { animation-delay: 0.18s; }
    #preloader .pl-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes pl-pulse {
      0%, 100% { opacity: 0.35; transform: translateY(0); }
      50%      { opacity: 1;    transform: translateY(-5px); }
    }
    /* Real load progress for the diorama's core set (flag.js sets --p, 0..1). Hidden until the
       diorama starts loading, so the classic town's near-instant paint shows only the dots. */
    #preloader .pl-bar {
      width: 168px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(249, 243, 230, 0.28); opacity: 0; transition: opacity 0.3s ease;
    }
    #preloader .pl-bar i {
      display: block; height: 100%; width: 100%; background: #f9f3e6; border-radius: 2px;
      transform-origin: 0 50%; transform: scaleX(var(--p, 0)); transition: transform 0.25s ease-out;
    }
    #preloader.loading .pl-bar { opacity: 1; }
    .sr-status {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }
    @media (max-width: 768px) { #preloader .pl-mark { font-size: 34px; } }
    @media (prefers-reduced-motion: reduce) {
      #preloader .pl-dots span { animation: none; opacity: 0.85; }
      #preloader .pl-bar i { transition: none; }
      #preloader { transition-duration: 0.001ms; }
    }
  </style>
</head>
<body>
  <div id="preloader" aria-hidden="true">
    <div class="pl-mark">Brendan Hoss</div>
    <div class="pl-dots"><span></span><span></span><span></span></div>
    <div class="pl-bar"><i></i></div>
  </div>
  <!-- Load progress for assistive tech (the preloader above is decorative): main.js announces
       "loading" and "ready" here. -->
  <div id="load-status" class="sr-status" role="status" aria-live="polite"></div>

  <canvas id="scene"></canvas>

  <!-- Top chrome -->
  <nav id="topnav">
    <span class="brand">Branford</span>
    <span class="brand-sub">Brendan Hoss</span>
  </nav>

  <!-- Fast path: always visible (even over the preloader). A real link, so it
       works before/without the JS bundle; main.js upgrades it in place. -->
  <a id="resume-btn" href="/resume" title="Read the résumé as a page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
    <span>Résumé</span>
  </a>

  <button id="mute" aria-label="Toggle sound" title="Sound on/off">
    <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
  </button>

  <!-- Controls hint (auto-dismisses) -->
  <div id="controls-hint">
    <div class="ch-row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>walk</span></div>
    <div class="ch-row"><span class="ch-tap">tap</span><span>to walk there</span></div>
    <div class="ch-row"><span class="ch-tap">drag</span><span>to look around</span></div>
  </div>

  <!-- Prev / next building (guided hop) -->
  <div id="nav-arrows">
    <button id="nav-prev" aria-label="Previous building" title="Previous building">‹</button>
    <button id="nav-next" aria-label="Next building" title="Next building">›</button>
  </div>

  <!-- Proximity prompt -->
  <div id="prompt" class="hidden">
    <span id="prompt-name"></span>
    <span class="prompt-key"><kbd>E</kbd> read</span>
  </div>

  <!-- Content card -->
  <div id="card-backdrop" class="hidden"></div>
  <!-- Non-modal dialog: the ‹ › arrows outside it stay in the Tab cycle while
       it's open (ui.js focus trap), so aria-modal would misdescribe it. -->
  <aside id="card" class="hidden" role="dialog">
    <button id="card-close" aria-label="Close">×</button>
    <div id="card-body"></div>
  </aside>

  <!-- Full résumé as real semantic HTML, pre-rendered from src/data.js at build
       time (vite-plugin-resume.js). Visually hidden in the town; shown as the
       "Read as a page" view (html.resume-open), and as the fallback when JS
       (html.no-js) or WebGL (body.no-webgl) is unavailable. -->
  <main id="resume" aria-labelledby="resume-title"><!--resume:prerender--></main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
